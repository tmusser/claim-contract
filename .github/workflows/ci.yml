name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify environment and source compilation
        run: |
          python -m pip check
          python -m compileall -q src tests

      - name: Run test suite
        run: pytest

      - name: Exercise CLI verdict and output paths
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          from claim_contract import build_contract_binding, load_contract

          contract = load_contract("examples/descriptive_summary/contract.yaml")
          revision = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True,
          ).strip()
          payload = {
              "schema_version": "1.0",
              "type": "claim_contract.evidence_receipts",
              "scientific_validation": False,
              "automatic_verification": False,
              "scope_notice": (
                  "These receipts record retained repository references only and do not verify "
                  "that the referenced material proves or adequately supports a declaration."
              ),
              "contract": {
                  "input_binding": build_contract_binding(contract).to_dict(),
              },
              "snapshot": {"repository_revision": revision},
              "receipts": [
                  {
                      "field": "evidence.design",
                      "refs": ["docs/RULE_TRACE.md"],
                  }
              ],
          }
          Path("receipt-sidecar.yaml").write_text(
              yaml.safe_dump(payload, sort_keys=False),
              encoding="utf-8",
          )
          PY

          claim-contract --version
          claim-contract validate examples/descriptive_summary/contract.yaml
          claim-contract validate examples/descriptive_summary/contract.yaml --json > /dev/null
          claim-contract validate examples/missing_uncertainty/contract.yaml
          claim-contract trace examples/descriptive_summary/contract.yaml --json > rule-trace.json
          claim-contract receipts inspect examples/descriptive_summary/contract.yaml receipt-sidecar.yaml --json > receipt-inspection.json
          claim-contract graph prune --json > graph-prune.json
          claim-contract graph prune --fail-on-candidate
          claim-contract dag inspect examples/claim_dag/dag.yaml > /dev/null
          claim-contract-graph prune --json > /dev/null
          claim-dag inspect examples/claim_dag/dag.yaml > /dev/null

          set +e
          claim-contract validate examples/missing_uncertainty/contract.yaml --warnings-as-errors
          review_code=$?
          claim-contract validate examples/onboarding_conversion/contract.yaml
          block_code=$?
          set -e

          test "$review_code" -eq 1
          test "$block_code" -eq 1

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Install wheel in an isolated environment
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install --upgrade pip
          .venv-smoke/bin/python -m pip install dist/*.whl
          .venv-smoke/bin/python -m pip check
          .venv-smoke/bin/claim-contract --version > version.txt
          .venv-smoke/bin/python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          from claim_contract import build_contract_binding, load_contract

          contract = load_contract("examples/descriptive_summary/contract.yaml")
          revision = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True,
          ).strip()
          payload = {
              "schema_version": "1.0",
              "type": "claim_contract.evidence_receipts",
              "scientific_validation": False,
              "automatic_verification": False,
              "scope_notice": (
                  "These receipts record retained repository references only and do not verify "
                  "that the referenced material proves or adequately supports a declaration."
              ),
              "contract": {
                  "input_binding": build_contract_binding(contract).to_dict(),
              },
              "snapshot": {"repository_revision": revision},
              "receipts": [
                  {
                      "field": "evidence.design",
                      "refs": ["docs/RULE_TRACE.md"],
                  }
              ],
          }
          Path("receipt-sidecar.yaml").write_text(
              yaml.safe_dump(payload, sort_keys=False),
              encoding="utf-8",
          )
          PY
          .venv-smoke/bin/claim-contract validate examples/descriptive_summary/contract.yaml --json > report.json
          .venv-smoke/bin/claim-contract trace examples/descriptive_summary/contract.yaml --json > rule-trace.json
          .venv-smoke/bin/claim-contract receipts inspect examples/descriptive_summary/contract.yaml receipt-sidecar.yaml --json > receipt-inspection.json
          .venv-smoke/bin/claim-contract report verify report.json \
            --contract examples/descriptive_summary/contract.yaml > binding-check.txt
          .venv-smoke/bin/claim-contract graph prune --json > graph-report.json
          .venv-smoke/bin/claim-contract dag inspect examples/claim_dag/dag.yaml > dag-report.txt
          .venv-smoke/bin/claim-contract-graph prune --json > /dev/null
          .venv-smoke/bin/claim-dag inspect examples/claim_dag/dag.yaml > /dev/null

      - name: Verify installed CLI metadata and scope fields
        run: |
          .venv-smoke/bin/python - <<'PY'
          import json
          from pathlib import Path

          from claim_contract.metadata import TOOL_NAME, TOOL_VERSION

          assert Path("version.txt").read_text(encoding="utf-8").strip() == (
              f"{TOOL_NAME} {TOOL_VERSION}"
          )

          payload = json.loads(Path("report.json").read_text(encoding="utf-8"))
          assert payload["type"] == "claim_contract.report"
          assert payload["schema_version"] == "1.0"
          assert payload["scientific_validation"] is False
          assert "not scientific validation" in payload["scope_notice"].lower()
          assert payload["not_evaluated"]

          contract = payload["contract"]
          assert contract["version"] == "0.1"
          binding = contract["input_binding"]
          assert binding["algorithm"] == "sha256"
          assert binding["canonicalization"] == "parsed-contract-v1"
          assert len(binding["contract_sha256"]) == 64

          trace = json.loads(Path("rule-trace.json").read_text(encoding="utf-8"))
          assert trace["type"] == "claim_contract.rule_trace"
          assert trace["schema_version"] == "1.0"
          assert trace["verdict"] == "READY"
          assert trace["scientific_validation"] is False
          assert trace["automatic_interpretation"] is False
          assert trace["summary"]["triggered_count"] == 0
          assert trace["rules"]

          receipts = json.loads(Path("receipt-inspection.json").read_text(encoding="utf-8"))
          assert receipts["type"] == "claim_contract.evidence_receipt_inspection"
          assert receipts["schema_version"] == "1.0"
          assert receipts["scientific_validation"] is False
          assert receipts["automatic_verification"] is False
          assert receipts["changes_validation_verdict"] is False
          assert receipts["contract"]["binding_match"] is True
          assert receipts["snapshot"]["revision_resolves"] is True
          assert receipts["summary"]["integrity_ok"] is True
          assert receipts["summary"]["receipted_count"] == 1
          assert receipts["summary"]["unreceipted_count"] > 0

          binding_output = Path("binding-check.txt").read_text(encoding="utf-8")
          assert "Binding: MATCH" in binding_output
          assert "Contract SHA-256: MATCH" in binding_output

          graph = json.loads(Path("graph-report.json").read_text(encoding="utf-8"))
          assert graph["type"] == "claim_contract.claim_graph_prune_report"
          assert graph["scientific_validation"] is False
          assert graph["automatic_retirement"] is False
          assert graph["mutates_ledger"] is False
          assert graph["counts"]["prune_candidates"] == 0
          PY

  action-smoke:
    name: GitHub Action smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: REVIEW passes by default
        uses: ./
        with:
          contract: examples/missing_uncertainty/contract.yaml

      - name: REVIEW fails when warnings are errors
        id: strict_review
        continue-on-error: true
        uses: ./
        with:
          contract: examples/missing_uncertainty/contract.yaml
          warnings-as-errors: "true"

      - name: Verify strict REVIEW failure
        env:
          STRICT_REVIEW_OUTCOME: ${{ steps.strict_review.outcome }}
        run: test "$STRICT_REVIEW_OUTCOME" = "failure"
