version: "0.1"
profile: minimum-v0.1

claim:
  text: "Crossing the eligibility threshold increased seven-day activation by 2 percentage points."
  type: causal
  population: users near the eligibility threshold
  time_window: "2026-01-01/2026-06-30"
  metric:
    name: seven_day_activation_rate
    unit: proportion
    definition: "Users activated within seven days / eligible users near the threshold"
  comparison:
    baseline: below_threshold
    comparison: above_threshold

evidence:
  design: quasi_experiment
  sample_size: 6400
  estimate:
    value: 0.02
    scale: absolute
    baseline_value: 0.25
  uncertainty:
    method: robust_interval
    level: 0.95
    lower: 0.004
    upper: 0.036
  provenance:
    source: warehouse.eligibility_threshold_analysis
  multiplicity:
    comparisons: 1
    adjustment: null
    rationale: null
  checks:
    metric_definition_locked: true
    missingness_assessed: true
    composition_stability_assessed: true
    treatment_assignment_validated: false
    identifying_assumptions_documented: true
    multiple_comparisons_assessed: true
  caveats:
    - "Causal interpretation depends on the recorded identifying assumptions and qualified analytical review."
