claims:
  - id: CCL-001
    status: OPEN
    provenance:
      generated_at: null
      recorded_at: "2026-07-27T20:07:34Z"
      origin_refs:
        - "https://github.com/tmusser/claim-contract/commit/0c2cea01537cf90dcc224614f2e35d4e1b2916fb"
      context_snapshot:
        repository_revision: "0c2cea01537cf90dcc224614f2e35d4e1b2916fb"
        refs:
          - examples/adversarial/agent_misuse/
          - schemas/report-v1.schema.json
          - docs/MACHINE_READABLE.md
        note: >-
          Backfilled from the commit that first recorded this claim. The earlier
          conversational generation timestamp and source transcript were not retained,
          so generated_at remains unknown rather than being inferred from commit time.
    claim: >-
      Giving an agent the full claim-contract machine-readable envelope reduces unsafe
      scientific overstatement relative to giving the same agent only the verdict and
      claim text.
    scope: >-
      Matched agent summaries of minimum-v0.1 reports across at least 30 report cases and
      at least two agent model families.
    decision_impact: >-
      Determines whether the scope_notice, scientific_validation flag, and not_evaluated
      fields can be defended as an empirically useful safety boundary rather than only a
      conservative interface design.
    judge_contract:
      support_if: >-
        In a predeclared paired evaluation, the full-envelope arm has an unsafe-summary
        rate at least 20 percentage points lower than the bare-verdict arm in pooled
        results, the direction is not worse in either model family, and correct reporting
        of READY/REVIEW/BLOCK falls by no more than 5 percentage points.
      refute_if: >-
        The pooled unsafe-summary rate is not lower in the full-envelope arm, or correct
        reporting of READY/REVIEW/BLOCK falls by more than 10 percentage points.
      otherwise: INCONCLUSIVE
    evidence:
      current_refs:
        - examples/adversarial/agent_misuse/
        - schemas/report-v1.schema.json
        - docs/MACHINE_READABLE.md
      counterevidence_or_gaps:
        - The current agent_misuse fixture demonstrates the intended boundary but is not a comparative multi-model agent evaluation.
        - No paired unsafe-summary rate has been measured yet.
      required:
        - A frozen paired evaluation set with safe/unsafe summary labels defined before model runs.
        - Results for at least two agent model families under matched prompts and decoding settings.
        - Per-arm unsafe-summary rate and correct READY/REVIEW/BLOCK reporting rate.
    next_adjudication: >-
      Build the smallest paired agent-summary evaluation that varies only bare verdict versus
      the full machine-readable envelope.
    judgment:
      last_evaluated: null
      judged_by: null
      evidence_refs: []
      note: null
    supersedes: null

  - id: CCL-002
    status: OPEN
    provenance:
      generated_at: null
