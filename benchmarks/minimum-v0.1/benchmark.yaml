benchmark_version: "1.0"
type: claim_contract.minimum_v0_1_benchmark
profile: minimum-v0.1
target_claim_id: CCL-002
case_count: 50
label_counts:
  blocking_violation: 25
  nonblocking_or_review: 25
labeling_status: frozen-before-first-scoring
results_status: unobserved-in-freeze-commit

purpose: >-
  Freeze a hand-labeled corpus for measuring BLOCK recall and false-BLOCK rate
  under minimum-v0.1 without defining labels from claim-contract verdicts.

artifacts:
  corpus: benchmarks/minimum-v0.1/corpus.yaml
  labels: benchmarks/minimum-v0.1/labels.yaml
  rubric: benchmarks/minimum-v0.1/RUBRIC.md
  evaluator: benchmarks/minimum-v0.1/evaluate.py
  result_schema: schemas/benchmark-result-v1.schema.json

covered_families:
  - descriptive
  - scope
  - provenance
  - sample_size
  - metric_governance
  - missingness
  - comparison_groups
  - relative_baseline
  - uncertainty
  - multiplicity
  - magnitude
  - observational_caveat
  - composition_stability
  - causal_design
  - randomization_integrity
  - identifying_assumptions

freeze_policy:
  labels_are_independent_of_validator_rule_ids: true
  expected_validator_verdicts_are_not_recorded: true
  expected_validator_rule_ids_are_not_recorded: true
  frozen_corpus_is_not_scored_by_repository_ci: true
  first_score_should_reference_a_merged_freeze_revision: true
  evaluator_does_not_adjudicate_target_claim: true

notes:
  - >-
    REVIEW-worthy cases may be labeled nonblocking because CCL-002 measures BLOCK
    recall and false-BLOCK rate, not exact READY/REVIEW/BLOCK agreement.
  - >-
    The corpus is synthetic and bounded. Even strong benchmark performance would
    not establish scientific validity or broad external coverage.
